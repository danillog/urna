name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check pipeline tests && uv run ruff format --check pipeline tests
      - name: Test
        run: uv run pytest
      - name: Generated dataset is up to date
        run: uv run python -m pipeline.build --check

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npx prettier --check src tests/web
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/index.html
