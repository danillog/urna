# Ideological family of every party that won an election in data/americas/elections.yaml.
#
# Families follow the four bands of the Global Party Survey 2019 (Norris), economic
# left–right scale V4 (0–10): left < 2.5 ≤ centre-left < 5 ≤ centre-right < 7.5 ≤ right.
#
# Each entry resolves the family one way:
#   gps: ABBR            the party's score in the Global Party Survey (Partyabb), used
#                        only when at least 5 experts rated that country's parties;
#   wikipedia: Article   the "position" field of the party's Wikipedia article, for
#                        parties the survey does not cover or covers with too few experts;
#   family: …, note: …   a reasoned call, when neither source settles it.
# `via` explains when the winner ran under a front or coalition led by another party.
#
# Keys are the party as the election infobox names it (article title when linked).

