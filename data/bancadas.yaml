# Bancadas temáticas da Câmara medidas pelo voto: bala, boi e bíblia. RASCUNHO para revisão.
#
# Cada entrada é uma votação nominal de plenário (id do arquivo votacoesVotos da Câmara) e o
# lado da bancada nela. A bancada de fato de um tema, numa legislatura, é quem vota com esse
# lado na maioria das votações do tema em que esteve presente.
#
#   - id: "14493-442"         # idVotacao da Câmara (dadosabertos.camara.leg.br/api/v2/votacoes/<id>)
#     date: 2015-06-30
#     bill: PEC 171/1993      # a proposição votada
#     what: o que se votou, numa frase
#     side: Sim | Não         # o voto da bancada
#     evidence: placar e orientações que sustentam o lado (do arquivo votacoesOrientacoes)
#     review: true            # ainda não conferido por uma pessoa: o lado ou o conteúdo
#
# Critérios do rascunho:
# - só votações disputadas: o lado perdedor com pelo menos 15% dos votos sim/não (quase
#   unanimidade não separa ninguém);
# - mérito (texto-base, PEC, emendas e destaques de conteúdo) e urgências; requerimentos de
#   adiamento, retirada de pauta e outros de obstrução ficam de fora;
# - o lado vem do conteúdo, conferido com a orientação dos partidos e, na bíblia, com o voto
#   dos deputados do PRB/Republicanos e do PSC.
#
# Limite dos anos antigos: até 2010 o plenário votava quase tudo de forma simbólica (2003 tem 61
# votações nominais; 2015, 313). Votações marcantes sem registro nominal no plenário:
# Estatuto do Desarmamento (2003; o voto nominal achado é o da comissão de Segurança Pública) e
# a urgência do PL 1904/2024 (aborto após 22 semanas como homicídio, simbólica em 2024).

