# Seats per party in Congress after each general election, and where each
# party sits from left to right. Read by pipeline/congress.py.
#
# Seats are written with the acronym the party used that year (PFL, not DEM, in
# 2002). The Chamber is the delegation elected; the Senate is the whole house
# after the election (the third or two thirds just elected plus those midway
# through their eight years), by the party each senator was in at the time.
#
# Sources:
# - Chamber 1990–2022 and Senate 2002–2022: the results infoboxes of the English
#   Wikipedia's "<year> Brazilian general election" articles (TSE figures);
#   federations of 2022 split by party from the same article's detailed tables.
# - 2026: data/raw/congress/2026.yaml, from the TSE count and the Senate's open
#   data (`uv run python -m pipeline.congress --refresh-2026`).
# The Senate before 2002 is left out: Wikipedia has only the senators elected
# each year, and the house after 1990 mixed terms of different lengths for the
# new states.

