# Left–right placement, by acronym. Each takes one of:
#   bls: <party>        Zucco & Power's estimate for that party (see below)
#   bolognesi: <party>  Bolognesi, Ribeiro & Codato's score, converted to the same scale
#   mean: [a, b]        a party formed by merger: the mean of its founders that year
# A list gives the placement by period (`since`/`until`, election years), for
# acronyms that named different parties. Acronyms not listed are unclassified.
#
# Zucco & Power: legislators place every party on a left–right scale in each
# wave of the Brazilian Legislative Surveys (1990–2021); the estimates are
# rescaled to about −1 (left) to +1 (right). Each election is placed with the
# wave taken during the term it elected (1990 → 1993, …, 2018 → 2021); 2022 and
# 2026 with the last one (2021). When a party is missing from that wave, the
# nearest wave up to four years away is used; beyond that it stays unclassified.
#   Zucco, C. and Power, T. J. (2024). The Ideology of Brazilian Parties and
#   Presidents: A Research Note on Coalitional Presidentialism Under Stress.
#   Latin American Politics and Society 66(1), doi:10.1017/lap.2023.24.
#   Data: doi:10.7910/DVN/6KVTUV (CC0), file
#   data/raw/congress/bls9_party_ideology.tab.
placement:
  PT: { bls: PT }
  PMDB: { bls: MDB }
  MDB: { bls: MDB }
  PSDB: { bls: PSDB }
  PFL: { bls: DEM }
  DEM: { bls: DEM }
  PDS: { bls: PP }
  PPR: { bls: PP }
  PPB: { bls: PP }
  PP:
    - { until: 1994, bls: PPold } # the Partido Progressista of 1993–95, merged into the PPB
    - { since: 1998, bls: PP }
  PL: { bls: PL }
  PR: { bls: PL }
  PDT: { bls: PDT }
  PTB: { bls: PTB }
  PSB: { bls: PSB }
  PCdoB: { bls: PCDOB }
  PCB: { bls: CID }
  PPS: { bls: CID }
  Cidadania: { bls: CID }
  PV: { bls: PV }
  PSOL: { bls: PSOL }
  REDE: { bls: REDE }
  PSD:
    - { since: 2011, bls: PSD } # Kassab's PSD; the PSD of the 1990s was another party
  PRB: { bls: REP }
  Republicanos: { bls: REP }
  SD: { bls: SD }
  PTN: { bls: PODE }
  PODE: { bls: PODE }
  PROS: { bls: PROS }
  PSC: { bls: PSC }
  NOVO: { bls: NOVO }
  PSL: { bls: PSL }
  PRN: { bls: PRN }
  PDC: { bls: PDC }
  PSTU: { bls: PSTU }
  PTC: { bolognesi: PTC }
  PTdoB: { bolognesi: Avante }
  Avante: { bolognesi: Avante }
  PMN: { bolognesi: PMN }
  Mobiliza: { bolognesi: PMN }
  PHS: { bolognesi: PHS }
  PRP: { bolognesi: PRP }
  PSDC: { bolognesi: DC }
  DC: { bolognesi: DC }
  PRTB: { bolognesi: PRTB }
  PPL: { bolognesi: PPL }
  PMB: { bolognesi: PMB }
  PEN: { bolognesi: Patriota }
  Patriota: { bolognesi: Patriota }
  PCO: { bolognesi: PCO }
  UNIÃO: { mean: [DEM, PSL] }
  PRD: { mean: [PTB, Patriota] }

# Bolognesi, B., Ribeiro, E. and Codato, A. (2023). Uma nova classificação
# ideológica dos partidos políticos brasileiros. Dados 66(2): e20210164,
# table 1: mean placement by 519 political scientists in 2018, 0 (left) to 10
# (right). Converted to Zucco & Power's scale by a straight line fitted on the
# parties both place (their 2017 wave), and used only for parties Zucco & Power
# do not cover.
bolognesi:
  PSTU: 0.51
  PCO: 0.61
  PCB: 0.91
  PSOL: 1.28
  PCdoB: 1.92
  PT: 2.97
  PDT: 3.92
  PSB: 4.05
  Rede: 4.77
  PPS: 4.92
  PV: 5.29
  PTB: 6.1
  Avante: 6.32
  SDD: 6.5
  PMN: 6.88
  PMB: 6.9
  PHS: 6.96
  MDB: 7.01
  PSD: 7.09
  PSDB: 7.11
  Podemos: 7.24
  PPL: 7.27
  PRTB: 7.45
  Pros: 7.47
  PRP: 7.59
  PRB: 7.78
  PR: 7.78
  PTC: 7.86
  DC: 8.11
  PSL: 8.11
  Novo: 8.13
  Progressistas: 8.2
  PSC: 8.33
  Patriota: 8.55
  DEM: 8.57

# The same parties in Zucco & Power's names, for the conversion.
bolognesi_to_bls:
  PSOL: PSOL
  PCdoB: PCDOB
  PT: PT
  PDT: PDT
  PSB: PSB
  Rede: REDE
  PPS: CID
  PV: PV
  PTB: PTB
  SDD: SD
  MDB: MDB
  PSD: PSD
  PSDB: PSDB
  Podemos: PODE
  Pros: PROS
  PRB: REP
  PR: PL
  Progressistas: PP
  PSC: PSC
  DEM: DEM

# Where the scale is cut into five groups, on Zucco & Power's scale. Our own
# cuts, even steps around the centre; the dots keep each party's exact place.
groups:
  left: -0.5
  centre-left: -0.15
  centre: 0.15
  centre-right: 0.5

# The Centrão is not a place on the left–right scale but a way of acting: parties
# that back whichever government is in power in exchange for posts and budget.
# It has no register and its members change, so it is marked only from `since`,
# with the parties the source lists as its core then.
centrao:
  since: 2022
  parties: [PP, Republicanos, PL, UNIÃO, PSD, Avante, SD]
  source:
    title: "Quem é quem no Centrão em 2026: conheça os líderes e partidos do bloco"
    outlet: Estado de Minas
    date: 2026-07-24
    url: https://www.em.com.br/nacional/2026/07/7467289-quem-e-quem-no-centrao-em-2026-conheca-os-lideres-e-partidos-do-bloco.html
